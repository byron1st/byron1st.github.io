experience:
  - company: 42dot
    role: Sr. Security Engineer, Security Platform Team
    period: 2024.01 — present
    bullets:
      - Designed, built, and operate a data-integrity security platform of 25+ servers on AWS EKS, with a private blockchain as a core component.
      - Raised platform throughput more than 3× through nonce-management caching, failover design, and a custom Go load balancer that routes by node sync health.
      - Built Prometheus/Grafana monitoring with Slack alerts, and a Redis-to-PostgreSQL failover path that keeps latency within about 10% under failure.
      - Operated a vulnerability-database pipeline that normalizes 10+ public sources, including ~130M BigQuery rows, with zero production resource outages.
      - Built a KMIP 3.0 / mTLS middleware that supplies keys from an external KMS into production CI/CD pipelines, plus a back-office dashboard for key lifecycle tracking.
  - company: Bigpicture Lab
    role: CTO & Fullstack Engineer
    period: 2018.05 — 2023.12
    bullets:
      - Led product engineering for an anonymous community service and a talent-evaluation SaaS, growing the engineering team to about ten people.
      - Designed and operated a Go REST API on GCP Cloud Run for a B2B talent-evaluation solution adopted in pilot by ~10 companies.
      - Built a blockchain-based anonymous community with wallet auth and rewards; ran it for a year as a Daejeon civic channel with ~2,700 users.
      - Partnered with ETRI and KOMSCO on experimental services spanning DID/token data exchange and multi-chain NFT middleware.
  - company: NavMine
    role: Founder & Software Engineer
    period: 2016.03 — 2018.05
    bullets:
      - Built and sold NavMine, a code recommendation and exploration tool for Java developers.
      - Developed application algorithms and Java bytecode instrumentation with ASM, plus a multi-platform Electron client.
  - company: Naver
    role: Intern, industry–academia cooperation program
    period: 2012.07 — 2012.08
    bullets:
      - Contributed to NFORGE 4 (Yobi), a version-control web server built with the Java Play Framework.
