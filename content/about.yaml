intro:
  - 저는 KAIST 소프트웨어 아키텍처 박사 과정과 10여 년간의 Backend Engineer (Blockchain, Security 도메인) 경험을 바탕으로, 안전한 고성능 백엔드 시스템의 설계, 개발, 운영 전반에 전문성을 갖춘 개발자입니다.
  - Go와 Node.js를 주력으로 대규모 웹 서비스 백엔드 및 분산 시스템을 구축해 왔으며, 특히 데이터 무결성 및 보안을 핵심 가치로 하는 플랫폼 개발을 담당했습니다. AWS EKS, GCP Cloud Run 기반의 클라우드 네이티브 환경 운영에 익숙하며, 복잡한 시스템이 확장성과 안정성을 갖출 수 있도록 개발을 해왔습니다.
  - 최근에는 Codex, Claude Code 등에서 사용할 개인 하네스를 만들고 실험하며, AI 네이티브 개발의 생산성과 품질을 높이는 방법을 고민하고 있습니다.
