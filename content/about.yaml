intro:
  - I am a backend and security engineer with a Ph.D. track in software architecture at KAIST and roughly ten years of experience building and operating production systems. My focus is the full lifecycle of safe, high-performance backends — design, implementation, and operations.
  - I work primarily in Go and Node.js on large-scale web backends and distributed systems, with data integrity and security as core design values. I am comfortable operating cloud-native environments on AWS EKS and GCP Cloud Run, and I care about systems that stay scalable and reliable under real load.
